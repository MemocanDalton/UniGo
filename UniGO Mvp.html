      --ok: #059669; --okBg: #ECFDF5; --warn: #D97706; --warnBg: #FFFBEB; --hot: #E11D48; --hotBg: #FFF1F2;

      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #090F10; --card: #111A1C; --card2: #172326; --ink: #F1F5F9; --mute: #94A8AB; --line: #213236;
        --acc: #2DD4BF; --accT: #061314; --soft: #132C2E; --g1: #2DD4BF; --g2: #38BDF8; --g3: #FBBF24;
        --ok: #34D399; --okBg: #064E3B; --warn: #FBBF24; --warnBg: #451A03; --hot: #FB7185; --hotBg: #4C0519;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #090F10; --card: #111A1C; --card2: #172326; --ink: #F1F5F9; --mute: #94A8AB; --line: #213236;
      --acc: #2DD4BF; --accT: #061314; --soft: #132C2E; --g1: #2DD4BF; --g2: #38BDF8; --g3: #FBBF24;
      --ok: #34D399; --okBg: #064E3B; --warn: #FBBF24; --warnBg: #451A03; --hot: #FB7185; --hotBg: #4C0519;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(600px 300px at 50% -80px, var(--soft), transparent) no-repeat, var(--bg);
      color: var(--ink);
      font: 400 14.5px/1.45 var(--f);
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font-family: var(--f); }
    #app { max-width: 540px; margin: 0 auto; padding: 18px 14px 110px; }
    h1 { font-size: 24px; margin: 0; }
    h2 { font-size: 17px; margin: 0 0 8px; }
    .mut { color: var(--mute); font-size: 12.5px; }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .brand h1 { font-size: 30px; font-weight: 900; letter-spacing: -1.2px; line-height: 1; }
    .brand h1 span {
      background: linear-gradient(135deg, var(--g1), var(--g2) 55%, var(--g3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .logo {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 21px;
      background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 6px 16px rgba(13,148,136,.32); flex-shrink: 0;
    }

    .hero {
      background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; border-radius: 18px;
      padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; box-shadow: 0 10px 24px rgba(13,148,136,.24);
    }
    .hero-stats { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; opacity: .92; }
    .hero-stats b { font-size: 15px; }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
      margin-bottom: 10px; box-shadow: 0 2px 6px rgba(15,23,42,.04); transition: transform .12s ease;
    }
    .card:active { transform: scale(.995); }
    .card.kapali { opacity: .62; }
    .grid-view { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-view .card { margin-bottom: 0; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .grid-view .foto, .grid-view .cover { height: 115px; max-height: 115px; }
    .grid-view .hide-g { display: none; }

    .cover {
      width: 100%; height: 130px; border-radius: 12px; margin-top: 8px;
      display: grid; place-items: center; font-size: 40px; position: relative; overflow: hidden;
    }
    .cover span {
      font-size: 11px; font-weight: 700; position: absolute; bottom: 8px; left: 10px;
      background: rgba(0,0,0,.35); color: #fff; padding: 2px 8px; border-radius: 6px; backdrop-filter: blur(4px);
    }
    .foto { display: block; width: 100%; max-height: 210px; object-fit: cover; border-radius: 12px; margin-top: 8px; }
    .foto[hidden] { display: none; }

    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .clk { cursor: pointer; }

    .btn {
      min-height: 44px; border: 0; border-radius: 13px; background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff; font: 600 14px var(--f); padding: 0 16px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(13,148,136,.26); display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; text-decoration: none;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.g { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
    .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
    .btn.danger { background: var(--hotBg); color: var(--hot); border: 1px solid rgba(225,29,72,.25); box-shadow: none; }
    .chips { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding: 6px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    .filter-scroll { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip {
      min-height: 34px; padding: 0 11px; border-radius: 20px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); font: 600 12.5px var(--f); cursor: pointer;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
    }
    .chip:disabled { opacity: .5; cursor: not-allowed; }
    a.chip { text-decoration: none; }
    .chip.on { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; border-color: transparent; }
    .tg { min-width: 38px; padding: 0 10px; justify-content: center; }

    .tag { background: var(--soft); color: var(--ink); border-radius: 7px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; }
    .tag.ara { background: var(--acc); color: var(--accT); }
    .tag.ok { background: var(--okBg); color: var(--ok); }
    .tag.warn { background: var(--warnBg); color: var(--warn); }
    .tag.hot { background: var(--hotBg); color: var(--hot); }
    .price { font-size: 16px; font-weight: 800; color: var(--acc); }

    label { display: block; font: 600 12px var(--f); color: var(--mute); margin-top: 10px; }
    input, select, textarea {
      display: block; width: 100%; min-height: 42px; margin-top: 4px; padding: 9px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font-size: 14.5px;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--acc); border-color: transparent; }
    select.mini { min-height: 34px; padding: 4px 10px; font-size: 12.5px; border-radius: 12px; margin: 0; width: auto; }
    .chk-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: 12px; margin-top: 8px; margin-right: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink);
    }
    .chk-pill input { width: auto; min-height: 0; margin: 0; }

    .otp-input { font-size: 22px; font-weight: 800; letter-spacing: 5px; text-align: center; min-height: 52px; }
    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card2);
      border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-bottom: 12px;
    }
    .auth-tabs button { min-height: 36px; border: 0; border-radius: 9px; background: none; color: var(--mute); font: 700 13px var(--f); cursor: pointer; }
    .auth-tabs button.on { background: var(--card); color: var(--acc); box-shadow: 0 2px 6px rgba(0,0,0,.06); }

    .fav-btn {
      border: 1px solid var(--line); background: var(--card); border-radius: 50%; width: 32px; height: 32px;
      display: inline-grid; place-items: center; cursor: pointer; font-size: 14px; padding: 0; flex-shrink: 0;
    }
    .fav-btn.on { border-color: #F43F5E; background: rgba(244,63,94,.12); }
    .p-head { display: flex; gap: 14px; align-items: center; }
    .avatar {
      width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff; font: 800 20px var(--f); display: grid; place-items: center; flex-shrink: 0;
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
      padding-top: 12px; border-top: 1px solid var(--line); text-align: center;
    }
    .stats b { display: block; font-size: 18px; }
    .seg {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card);
      border: 1px solid var(--line); padding: 4px; border-radius: 14px; margin: 12px 0;
    }
    .seg button { min-height: 36px; border: 0; border-radius: 10px; background: none; color: var(--mute); font: 600 13px var(--f); cursor: pointer; }
    .seg button.on { background: var(--soft); color: var(--acc); }

    .qa-item { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
    .qa-ans { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--ok); font-size: 13px; }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(9,13,22,.68); backdrop-filter: blur(5px);
      z-index: 20; display: grid; place-items: end center; padding: 10px;
    }
    .modal-bg[hidden] { display: none; }
    .modal {
      background: var(--card); border: 1px solid var(--line); border-radius: 22px; width: 100%;
      max-width: 500px; max-height: 88vh; overflow-y: auto; padding: 18px; box-shadow: 0 24px 48px rgba(0,0,0,.4);
    }
    .modal .foto { max-height: 280px; }

    nav {
      position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    }
    nav div { display: flex; max-width: 540px; margin: 0 auto; gap: 4px; }
    nav button {
      flex: 1; min-height: 48px; border: 0; background: none; color: var(--mute); font: 600 11px var(--f);
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px;
    }
    nav button.on { color: var(--acc); background: var(--soft); }
    .ic { font-size: 19px; line-height: 1; }

    #toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      max-width: 508px; margin: 0 auto; background: var(--ink); color: var(--bg);
      padding: 12px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; z-index: 30;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }
    #toast[hidden] { display: none; }
    .err { color: #E11D48; font-size: 13px; min-height: 18px; margin-top: 6px; font-weight: 600; }
    .thumbs { display: flex; gap: 6px; margin: 0 0 10px; overflow-x: auto; }
    .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
    .thumbs img.on { border-color: var(--acc); }
    .pv { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pv .pi { position: relative; }
    .pv img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
    .pv button { position: absolute; top: -6px; inset-inline-end: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--hot); color: #fff; font-size: 12px; line-height: 22px; padding: 0; cursor: pointer; }
    .stars { color: #F59E0B; letter-spacing: 1px; }
    @media (max-width: 700px) { input, select, textarea { font-size: 16px; } }

    const LANGS = ['tr', 'en', 'ar'];
    let lang = localStorage.getItem('unigo_lang') || 'tr';
    if (!I18N[lang]) lang = 'tr';
    const L = () => I18N[lang];
    const applyLangDir = () => {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang == 'ar' ? 'rtl' : 'ltr';
    };
    applyLangDir();

    let state = {
      users: saved.users && typeof saved.users === 'object' ? saved.users : {},
      curUser: typeof saved.curUser === 'string' ? saved.curUser : '',
      token: String(saved.token || ''),
      refresh: String(saved.refresh || ''),
      fav: Array.isArray(saved.fav) ? saved.fav : [],
      ilanlar: Array.isArray(saved.ilanlar) ? saved.ilanlar : []
    };

    const sbBase = () => SB_URL.replace(/\/$/, '');

    // ---- Oturum otomatik yenileme (1 saat sonra çıkış olmasın) ----
    const _rawFetch = fetch.bind(window);
    let refreshing = null;
    const jwtExp = t => { try { return JSON.parse(atob(String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } };
    function sessionExpired() {
      if (!state.curUser) return;
      state.token = ''; state.refresh = ''; state.curUser = '';
      sv();
      toast(L().t_sessExp);
      render();
    }
    function refreshSession() {
      if (!state.refresh) return Promise.resolve(false);
      if (!refreshing) {
        refreshing = (async () => {
          try {
            const res = await _rawFetch(`${sbBase()}/auth/v1/token?grant_type=refresh_token`, {
              method: 'POST', headers: sbHeaders(false), body: JSON.stringify({ refresh_token: state.refresh })
            });
            if (res.ok) {
              const d = await res.json();
              if (d.access_token) { state.token = d.access_token; state.refresh = d.refresh_token || state.refresh; sv(); return true; }
            } else if (res.status === 400 || res.status === 401 || res.status === 403) {
              sessionExpired();
            }
          } catch (e) {}
          return false;
        })().finally(() => { refreshing = null; });
      }
      return refreshing;
    }
    window.fetch = async (url, opt) => {
      opt = opt || {};
      const bearer = opt.headers && (opt.headers.Authorization || opt.headers.authorization);
      if (!String(url).startsWith(SB_URL) || !bearer || !state.token || bearer !== 'Bearer ' + state.token) return _rawFetch(url, opt);
      const exp = jwtExp(state.token);
      if (exp && exp - Date.now() < 60000 && state.refresh) await refreshSession();
      const send = () => _rawFetch(url, { ...opt, headers: { ...opt.headers, 'Authorization': 'Bearer ' + state.token } });
      let res = await send();
      if (res.status === 401 && state.refresh && await refreshSession()) res = await send();
      return res;
    };
    const sbHeaders = (useAuth = false) => {
      const h = {
        'Content-Type': 'application/json',
        'apikey': SB_KEY
      };
      if (useAuth && state.token) {
        h['Authorization'] = 'Bearer ' + state.token;
      } else if (!SB_KEY.startsWith('sb_publishable_')) {
        h['Authorization'] = 'Bearer ' + SB_KEY;
      }
      return h;
    };

    const getMe = () => state.curUser && state.users[state.curUser] ? state.users[state.curUser] : null;
    const isEdu = m => /^[^\s@]+@[^\s@]+\.edu\.tr$/i.test(String(m || '').trim());

    function needsAnnualVerify(u) {
      if (!u || !u.verified || !u.verifiedAt) return true;
      const now = new Date();
      const octThis = new Date(now.getFullYear(), 9, 1).getTime();
      const lastOct = now.getTime() >= octThis ? octThis : new Date(now.getFullYear() - 1, 9, 1).getTime();
      return u.verifiedAt < lastOct;
    }

    let tab = 'paz', ptab = 'ilanlar', profEditing = false, cat = 'Tümü', tur = 'Tümü', sirala = 'yeni', fTag = '';

      const t = $('toast');

      tt = setTimeout(() => t.hidden = true, 3800);

    const save = () => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        return 1;

        return 0;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const ago = t => {
      const m = Math.max(0, Math.floor((Date.now() - t) / 6e4)), d = L();
      return m < 1 ? d.justNow : m < 60 ? `${m} ${d.minAgo}` : m < 1440 ? `${Math.floor(m / 60)} ${d.hrAgo}` : `${Math.floor(m / 1440)} ${d.dayAgo}`;
    };

    // ---- Profil (bölüm/sınıf/iletişim) Supabase'de saklanır ----
    async function saveProfile(u) {
      if (!u || !state.token) return;
      try {
        await sbWrite('POST', `${sbBase()}/rest/v1/unigo_profiles?on_conflict=id`,
          { id: u.id, ad: u.ad || '', bolum: u.bolum || '', sinif: u.sinif || '', iletisim: u.iletisim || '', favs: state.fav },
          ['favs'], { 'Prefer': 'resolution=merge-duplicates,return=minimal' });
      } catch (e) {}
    }

    async function saveFavs() {
      const u = getMe();
      if (!u || !state.token) return;
      try {
        const res = await sbWrite('PATCH', `${sbBase()}/rest/v1/unigo_profiles?id=eq.${encodeURIComponent(u.id)}`,
          { favs: state.fav }, [], { 'Prefer': 'return=representation' });
        if (res.ok) { const rows = await res.json(); if (!rows.length) saveProfile(u); }
      } catch (e) {}
    }

    async function loadProfile(u) {
      if (!u || !state.token) return;
      try {
        const res = await fetch(`${sbBase()}/rest/v1/unigo_profiles?id=eq.${encodeURIComponent(u.id)}&select=*`, { headers: sbHeaders(true) });
        if (!res.ok) return;
        const rows = await res.json();
        if (rows && rows[0]) {
          const r = rows[0];
          u.ad = r.ad || u.ad;
          u.bolum = r.bolum || '';
          u.sinif = r.sinif || '';
          u.iletisim = r.iletisim || '';
          if (Array.isArray(r.favs)) {
            if (r.favs.length) state.fav = r.favs.slice();
            else if (state.fav.length) saveFavs();
          }
          sv();
          render();
        } else if (u.bolum || u.sinif || u.iletisim) {
          saveProfile(u);
        }
      } catch (e) {}
    }

    // ---- Üniversite (mailden) ----
    const UNI_NAMES = { itu: 'İTÜ', metu: 'ODTÜ', boun: 'Boğaziçi', bogazici: 'Boğaziçi', hacettepe: 'Hacettepe', yildiz: 'Yıldız Teknik', ankara: 'Ankara Üni.', istanbul: 'İstanbul Üni.', ege: 'Ege Üni.', gtu: 'GTÜ', bilkent: 'Bilkent', koc: 'Koç' };
    const UNI_GENERIC = ['ogr', 'std', 'stu', 'student', 'students', 'ogrenci', 'mail', 'edu', 'alumni'];
    const uniOf = email => {
      const m = String(email || '').trim().toLowerCase().match(/@([^@\s]+)\.edu\.tr$/);
      if (!m) return '';
      const c = m[1].split('.').pop();
      return UNI_GENERIC.includes(c) ? '' : c;
    };
    const uniName = c => c ? (UNI_NAMES[c] || c.toUpperCase()) : '';

    // ---- Satıcı puanı ----
    const sellerStats = id => {
      const r = reviews.filter(v => v.seller_id == id);
      if (!r.length) return null;
      return { n: r.length, avg: r.reduce((a, v) => a + (+v.rating || 0), 0) / r.length };
    };
    const starStr = n => { const k = Math.max(0, Math.min(5, Math.round(n))); return '★'.repeat(k) + '☆'.repeat(5 - k); };
    const ratingTag = id => { const st = sellerStats(id); return st ? `<span class="stars">★</span>${st.avg.toFixed(1)} (${st.n})` : ''; };

    async function syncReviews() {
      try {
        const res = await fetch(`${sbBase()}/rest/v1/unigo_reviews?select=*&order=created_at.desc&limit=1000`, { headers: sbHeaders(false) });
        if (res.ok) { const rows = await res.json(); if (Array.isArray(rows)) { reviews = rows; render(); } }
      } catch (e) {}
    }

    // ---- Supabase yazma (yeni sütun yoksa eski haline düş) ----
    async function sbWrite(method, url, body, optional, extra) {
      const hd = { ...sbHeaders(true), ...(extra || {}) };
      let res = await fetch(url, { method, headers: hd, body: JSON.stringify(body) });
      if (!res.ok && optional && optional.length) {
        let msg = '';
        try { msg = JSON.stringify(await res.clone().json()); } catch (e) {}
        if (/column|schema cache|PGRST204/i.test(msg)) {
          const b2 = { ...body };
          optional.forEach(k => delete b2[k]);

    // ---- Fotoğrafları Supabase Storage'a yükle ----
    async function uploadPhotos(list, u) {
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const src = list[i];
        if (!String(src).startsWith('data:')) { out.push(src); continue; }
        try {
          const blob = await (await fetch(src)).blob();
          const path = `${u.id}/${uid()}_${i}.jpg`;
          const res = await fetch(`${sbBase()}/storage/v1/object/ilan-foto/${path}`, {
            method: 'POST',
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + state.token, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' },
            body: blob
          });
          if (res.ok) { out.push(`${sbBase()}/storage/v1/object/public/ilan-foto/${path}`); continue; }
        } catch (e) {}
        out.push(src); // Storage hazır değilse eski yöntem (yedek)
      }
      return out;
    }

    function syncResendBtn() {
      const btn = $('resend-btn');
      if (!btn) return;
      const rem = Math.max(0, Math.ceil((otpCooldownEnd - Date.now()) / 1000));
      btn.disabled = rem > 0;
      btn.textContent = rem > 0 ? `${L().otpResend} (${rem}s)` : L().otpResend;
      if (rem <= 0 && otpTimer) { clearInterval(otpTimer); otpTimer = null; }
    }

    function startOtpCooldown() {
      otpCooldownEnd = Date.now() + 60000;
      clearInterval(otpTimer);
      otpTimer = setInterval(() => {
        if ($('modal').hidden || !$('resend-btn')) { clearInterval(otpTimer); otpTimer = null; return; }
        syncResendBtn();
      }, 1000);
      syncResendBtn();
    }

      otpReason = reason;
      openOtpModal();

      const err = $('otp-err');
      if (err) err.textContent = '';
      try {
        const endpoint = otpVerifyType === 'signup' ? '/auth/v1/resend' : '/auth/v1/otp';
        const payload = otpVerifyType === 'signup' ? { type: 'signup', email } : { email, create_user: false };
        const res = await fetch(`${sbBase()}${endpoint}`, { method: 'POST', headers: sbHeaders(false), body: JSON.stringify(payload) });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          if (err) err.textContent = data.msg || data.message || data.error_description || 'Kod gönderilemedi.';
        } else {

    document.addEventListener('click', async e => {

        if (i == 'ver') { requireVerifiedStudent(() => { tab = 'ver'; render(); }); return; }
        tab = i;
        if (i != 'ver') { editId = ''; fotos = []; }
      }
      else if (a == 'openAuth') { openAuthModal('login'); return; }
      else if (a == 'authTab') { openAuthModal(i); return; }
      else if (a == 'verifySelf') {
        const u = getMe();

          otpVerifyType = u.verified ? 'email' : 'signup';
          sendOtpCode(u.email, u.verified ? 'annual' : 'signup');
        }
        return;
      }
      else if (a == 'resendOtp') {
        const u = getMe();
        if (u) sendOtpCode(u.email, otpReason);

      }

    document.addEventListener('submit', async e => {
      e.preventDefault();
      const t = e.target, f = Object.fromEntries(new FormData(t)), d = L();

      if (t.id == 'f-auth') {
        const err = $('auth-err'), btn = $('auth-sub');
        err.textContent = '';
        const email = tr(f.email.trim()), pass = String(f.pass || '');
        if (!isEdu(email)) { err.textContent = d.e_eduOnly; return; }
        if (pass.length < 6) { err.textContent = d.e_pass; return; }

        btn.disabled = true;
        try {
          if (authMode == 'reg') {
            const res = await fetch(`${sbBase()}/auth/v1/signup`, {
              method: 'POST',
              headers: sbHeaders(false),
              body: JSON.stringify({ email, password: pass, data: { ad: (f.ad || '').trim() } })
            });
            const data = await res.json();
            if (!res.ok) {
              err.textContent = data.msg || data.error_description || d.e_exists;
              btn.disabled = false;
              return;
            }
                  const su = data.user || data;
            if (su && Array.isArray(su.identities) && su.identities.length === 0) {
              toast(d.e_taken);
              openAuthModal('login');
              const loginEmailInput = document.querySelector('#f-auth input[name="email"]');
              const loginPassInput = document.querySelector('#f-auth input[name="pass"]');
              if (loginEmailInput) loginEmailInput.value = email;
              if (loginPassInput) loginPassInput.focus();
              return;
            }
            const uidVal = (data.user && data.user.id) || data.id || 'u_' + uid();
            state.users[email] = { id: uidVal, email, ad: (f.ad || '').trim(), bolum: '', sinif: '', iletisim: '', verified: false, verifiedAt: 0 };
            state.curUser = email;
            if (data.access_token) { state.token = data.access_token; state.refresh = data.refresh_token || state.refresh; }
            sv();

            if (data.access_token) {
              otpVerifyType = 'email';
              await sendOtpCode(email, 'signup');
            } else {
              otpReason = 'signup';
              otpVerifyType = 'signup';
              toast(d.t_codeSent);
              openOtpModal();
              startOtpCooldown();
            }
            render();
          } else {
            const res = await fetch(`${sbBase()}/auth/v1/token?grant_type=password`, {
              method: 'POST',
              headers: sbHeaders(false),
              body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (!res.ok) {
              if (String(data.error_code || data.msg || '').toLowerCase().includes('confirm')) {
                state.users[email] = state.users[email] || { id: 'u_' + uid(), email, ad: email.split('@')[0], bolum: '', sinif: '', iletisim: '', verified: false, verifiedAt: 0 };
                state.curUser = email;
                sv();
                otpVerifyType = 'signup';
                await sendOtpCode(email, 'signup');
                render();
                return;
              }
              err.textContent = d.e_login;
              btn.disabled = false;
              return;
            }
            const prev = state.users[email] || {};
            state.users[email] = {
              id: data.user.id,
              email,
              ad: prev.ad || (data.user.user_metadata && data.user.user_metadata.ad) || email.split('@')[0],
              bolum: prev.bolum || '',
              sinif: prev.sinif || '',
              iletisim: prev.iletisim || '',
              verified: true,
              verifiedAt: prev.verifiedAt || Date.now()
            };
            state.curUser = email;
            state.token = data.access_token;
            state.refresh = data.refresh_token || '';
            sv();
            await loadProfile(state.users[email]);
            $('modal').hidden = true;
            toast(d.t_loginOk);
            render();
            if (needsAnnualVerify(state.users[email])) {
              otpVerifyType = 'email';
              await sendOtpCode(email, 'annual');
            }
          }
        } catch (ex) {
          err.textContent = 'Bağlantı hatası.';
        }
        btn.disabled = false;
        return;
      }

      if (t.id == 'f-otp') {
        const err = $('otp-err'), btn = $('otp-sub');
        err.textContent = '';
        const code = String(f.code || '').trim();
        const u = getMe();
        if (!u) return;

        btn.disabled = true;
        try {
          const res = await fetch(`${sbBase()}/auth/v1/verify`, {
            method: 'POST',
            headers: sbHeaders(false),
            body: JSON.stringify({ email: u.email, token: code, type: otpVerifyType })
          });
          const data = await res.json();
          if (!res.ok) {
            err.textContent = d.e_otp;
            btn.disabled = false;
            return;
          }
          if (data.access_token) { state.token = data.access_token; state.refresh = data.refresh_token || state.refresh; }
          if (data.user && data.user.id) u.id = data.user.id;
        } catch (ex) {
          err.textContent = d.e_otp;
          btn.disabled = false;
          return;
        }
        btn.disabled = false;
        u.verified = true;
        u.verifiedAt = Date.now();
        sv();
        $('modal').hidden = true;
        toast(d.t_verified);
        tab = 'ver';
        render();
        return;
      }

      if (t.id == 'f-qa') {
        const u = getMe();

        const x = state.ilanlar.find(y => y.id == t.dataset.id);
        if (x && f.soru.trim()) {
          x.sorular = x.sorular || [];
          const yeniSoru = { kim: u.ad || u.email.split('@')[0], metin: f.soru.trim(), cevap: '', t: Date.now() };
          x.sorular.push(yeniSoru);
          sv();
          toast(d.t_qa);
          openModal(x.id, false);
          fetch(`${sbBase()}/rest/v1/rpc/unigo_ask`, {
            method: 'POST',
            headers: sbHeaders(true),
            body: JSON.stringify({ p_id: String(x.id), p_q: yeniSoru })
          }).catch(() => {});
        }
        return;
      }

      if (t.classList.contains('f-ans')) {
        const u = getMe();
        const x = state.ilanlar.find(y => y.id == t.dataset.id);
        const idx = +t.dataset.idx;
        if (u && x && x.sahip == u.id && x.sorular && x.sorular[idx] && f.cevap.trim()) {
          x.sorular[idx].cevap = f.cevap.trim();
          sv();
          toast(d.t_ans);
          openModal(x.id, false);
          fetch(`${sbBase()}/rest/v1/unigo_listings?id=eq.${encodeURIComponent(x.id)}`, {
            method: 'PATCH',
            headers: sbHeaders(true),
            body: JSON.stringify({ sorular: x.sorular })
          }).catch(() => {});
        }
        return;
      }

      if (t.id == 'f-review') {
        const u = getMe();
        if (!u || !state.token) { openAuthModal('login'); return; }
        if (!u.verified || needsAnnualVerify(u)) { requireVerifiedStudent(); return; }
        const sellerId = t.dataset.seller;
        if (!sellerId || sellerId == u.id) return;
        const row = {
          seller_id: sellerId, reviewer_id: u.id, listing_id: t.dataset.id,
          rating: +f.puan, comment: String(f.yorum || '').trim().slice(0, 140),
          reviewer_name: u.ad || u.email.split('@')[0], created_at: Date.now()
        };
        if (!(row.rating >= 1 && row.rating <= 5)) return;
        try {
          const res = await fetch(`${sbBase()}/rest/v1/unigo_reviews?on_conflict=seller_id,reviewer_id`, {
            method: 'POST',
            headers: { ...sbHeaders(true), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify(row)
          });
          if (!res.ok) { toast(d.e_rated); return; }
        } catch (ex) { toast(d.e_rated); return; }
        reviews = reviews.filter(v => !(v.seller_id == row.seller_id && v.reviewer_id == row.reviewer_id));
        reviews.unshift(row);
        toast(d.t_rated);
        openModal(t.dataset.id, false);
        return;
      }

      if (t.id == 'f-report') {
        const u = getMe(), er = $('rep-err');
        if (!u || !state.token) { openAuthModal('login'); return; }
        try {
          const res = await fetch(`${sbBase()}/rest/v1/unigo_reports?on_conflict=listing_id,reporter_id`, {
            method: 'POST',
            headers: { ...sbHeaders(true), 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
            body: JSON.stringify({ listing_id: t.dataset.id, reporter_id: u.id, reason: f.neden, note: String(f.not || '').trim().slice(0, 200) })
          });
          if (!res.ok) { if (er) er.textContent = d.e_report; return; }
        } catch (ex) { if (er) er.textContent = d.e_report; return; }
        $('modal').hidden = true;
        toast(d.t_reported);
        render();
        return;
      }

      const hata = m => { $('err').textContent = m; };
      if (t.id == 'f-ilan') {
        const u = getMe();
        if (!u || !u.verified || needsAnnualVerify(u)) { requireVerifiedStudent(); return; }
        const bs = f.baslik.trim(), fy = f.fiyat.trim(), ic = f.iletisim.trim();
        if (bs.length < 3) return hata(d.e_title);
        if (!/^\d{1,6}$/.test(fy)) return hata(d.e_price);
        if (ic.length < 3) return hata(d.e_contact);

        const payload = {
          tur: TYPES.includes(f.tur) ? f.tur : 'Satılık',
          baslik: bs,
          kat: CATS.includes(f.kat) ? f.kat : 'Diğer',
          kondisyon: CONDS.includes(f.kondisyon) ? f.kondisyon : 'İyi Durumda',
          fiyat: fy,
          takas: !!f.takas,
          pazarlik: !!f.pazarlik,
          acil: !!f.acil,
          iletisim: ic,
          acik: f.acik.trim(),
          foto: '',
          fotolar: []
        };
        const btn = $('pub-btn');
        if (btn) btn.disabled = true;
        if (fotos.some(s => String(s).startsWith('data:'))) toast(d.uploading);
        const urls = await uploadPhotos(fotos, u);
        payload.foto = urls[0] || '';
        payload.fotolar = urls;

        if (editId) {
          const idx = state.ilanlar.findIndex(x => x.id == editId);
          if (idx > -1) {
            state.ilanlar[idx] = { ...state.ilanlar[idx], ...payload, sahipAd: u.ad || state.ilanlar[idx].sahipAd };
            await sbWrite('PATCH', `${sbBase()}/rest/v1/unigo_listings?id=eq.${encodeURIComponent(editId)}`,
              { ...payload, sahip_ad: state.ilanlar[idx].sahipAd }, ['fotolar']).catch(() => {});
            save();
            toast(d.t_upd);
          }
          editId = '';
          fotos = [];
          tab = 'prof';
          ptab = 'ilanlar';
        } else {
          const now = Date.now(), newId = uid(), sahipAd = u.ad || u.email.split('@')[0];
          const n = { id: newId, t: now, sahip: u.id, sahipAd, durum: '', goruntuleme: 1, sorular: [], uni: uniOf(u.email), ...payload };
          try {
            const res = await sbWrite('POST', `${sbBase()}/rest/v1/unigo_listings`, {
              id: newId, user_id: u.id, tur: n.tur, baslik: n.baslik, kat: n.kat, kondisyon: n.kondisyon,
              fiyat: n.fiyat, takas: n.takas, pazarlik: n.pazarlik, acil: n.acil, iletisim: n.iletisim,
              acik: n.acik, foto: n.foto, fotolar: n.fotolar, uni: n.uni, sahip_ad: sahipAd, durum: '', goruntuleme: 1, sorular: [], created_at: now
            }, ['fotolar', 'uni']);
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              if (btn) btn.disabled = false;
              return hata(errData.message || 'İlan kaydedilemedi.');
            }
          } catch (ex) {
            if (btn) btn.disabled = false;
            return hata('Bağlantı hatası.');
          }
          if (!u.iletisim) {
            u.iletisim = ic;
            saveProfile(u);
          }
          state.ilanlar.unshift(n);
          save();
          const m = eslesen(n).length;
          toast(m ? `${d.t_pubMatch} ${m}` : d.t_pub);
          fotos = [];
          tab = 'paz';
          cat = 'Tümü';
          tur = 'Tümü';
          fTag = '';
          q = '';
          esl = m ? n.id : '';
        }
      }
      else if (t.id == 'f-profil') {
        const u = getMe();
        if (!u) return;
        u.ad = f.ad.trim();
        u.bolum = f.bolum.trim();
        u.sinif = f.sinif;
        u.iletisim = f.iletisim.trim();
        state.ilanlar.forEach(x => { if (x.sahip == u.id) x.sahipAd = u.ad || u.email.split('@')[0]; });
        saveProfile(u);
        profEditing = false;
        toast(d.t_prof);
      }
      sv();
      render();
    });

    document.addEventListener('input', e => {
      if (e.target.id == 'q') {
        q = e.target.value;
        $('list').innerHTML = list();
      }
    });

    document.addEventListener('change', async e => {
      if (e.target.id == 'sirala') {
        sirala = e.target.value;
        $('list').innerHTML = list();
        return;
      }
      if (e.target.id != 'foto') return;
      const files = [...e.target.files];
      e.target.value = '';
      if (!files.length) return;
      const room = 4 - fotos.length;
      if (room <= 0 || files.length > room) toast(L().maxPhotos);
      for (const f of files.slice(0, Math.max(room, 0))) {
        const u = await new Promise(r => kucult(f, r));
        if (u) fotos.push(u); else toast('Fotoğraf yüklenemedi.');
      }
      renderPv();
    });

    const kucult = (file, cb) => {
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, 900 / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * k);
          c.height = Math.round(im.height * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', .78));
        };
        im.onerror = () => cb('');
        im.src = r.result;
      };
      r.onerror = () => cb('');
      r.readAsDataURL(file);
    };

    if (state.curUser && state.token && !state.refresh && jwtExp(state.token) && jwtExp(state.token) < Date.now()) sessionExpired();
    render();
    syncListings();
    syncReviews();
    loadProfile(getMe());

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tab == 'prof') render(); });
    window.addEventListener('appinstalled', () => { deferredInstall = null; if (tab == 'prof') render(); });
  </script>
</body>
</html>
